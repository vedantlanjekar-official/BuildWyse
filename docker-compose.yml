services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FORCE_MEMORY_STORE: ${FORCE_MEMORY_STORE:-false}
      AI_MODE: ${AI_MODE:-stub}
      DEBUG: ${DEBUG:-true}
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./integrations:/app/integrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEV_AUTH: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
